# Apache Virtual Host Configuration for BexChat
# Place in /etc/apache2/sites-available/bexchat.conf or use .htaccess

<VirtualHost *:80>
    ServerName yourdomain.com
    DocumentRoot /home/username/public_html

    # Redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName yourdomain.com
    DocumentRoot /home/username/public_html

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/yourdomain.com/privkey.pem

    # Proxy API requests to Django
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # SSE: disable buffering for realtime events
    <Location /api/realtime/events/>
        ProxyPass http://127.0.0.1:8000/api/realtime/events/
        SetEnv proxy-sendchunked 1
        SetEnv proxy-interim-response RFC
    </Location>

    # Frontend: SPA routing
    <Directory /home/username/public_html>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</VirtualHost>
